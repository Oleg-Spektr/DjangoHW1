{% extends 'catalog/base.html' %}

{% block title %}Контакты - Skystore{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1>Контакты</h1>
    <table class="table w-50">
        <tr><td><strong>Страна</strong></td><td>USA</td></tr>
        <tr><td><strong>ИНН</strong></td><td>91-1144442</td></tr>
        <tr><td><strong>Адрес</strong></td><td>Redmond, WA, 98052-6399</td></tr>
    </table>

    <div class="card p-4 mt-4" style="max-width: 500px;">
        <h4>Свяжитесь с нами</h4>
        {% if message_sent %}
            <div class="alert alert-success">Сообщение успешно отправлено!</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Имя</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Телефон</label>
                <input type="text" name="phone" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Сообщение</label>
                <textarea name="message" class="form-control" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Отправить</button>
        </form>
    </div>
</div>
{% endblock %}
