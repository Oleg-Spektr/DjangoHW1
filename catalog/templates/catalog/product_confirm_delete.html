{% extends 'catalog/base.html' %}
{% block content %}
<div class="card p-4 border-danger mx-auto text-center shadow-sm" style="max-width: 500px;">
    <h2 class="text-danger">Удаление продукта</h2>
    <p class="lead">Вы действительно хотите безвозвратно удалить товар <strong>"{{ object.name }}"</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger px-4">Да, удалить</button>
        <a href="{% url 'catalog:home' %}" class="btn btn-secondary px-4">Отмена</a>
    </form>
</div>
{% endblock %}
