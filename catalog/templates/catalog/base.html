<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Skystore{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Подключаем подшаблон главного меню (Критерий) -->
    {% include 'catalog/includes/inc_menu.html' %}

    <div class="container mt-5">
        {% block content %}
        <!-- Здесь будет уникальный контент каждой страницы -->
        {% endblock %}
    </div>

    <footer class="bg-light text-center text-lg-start mt-5 py-3">
        <div class="container text-center text-muted">
            SkyStore © 2026
        </div>
    </footer>
</body>
</html>
