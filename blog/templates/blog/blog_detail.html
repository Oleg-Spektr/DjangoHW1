{% extends 'catalog/base.html' %}

{% block content %}
<div class="mt-4">
    <a href="{% url 'blog:list' %}" class="btn btn-outline-secondary btn-sm mb-3">Назад к списку статей</a>
    <h1>{{ blog.title }}</h1>
    <p class="text-muted">Дата публикации: {{ blog.created_at }} | Просмотров: {{ blog.views_count }}</p>
    <hr>
    {% if blog.preview %}
        <img src="{{ blog.preview.url }}" class="img-fluid rounded mb-4" style="max-height: 400px; object-fit: cover;" alt="Превью">
    {% endif %}
    <div class="lead" style="white-space: pre-wrap;">{{ blog.content }}</div>
</div>
{% endblock %}
