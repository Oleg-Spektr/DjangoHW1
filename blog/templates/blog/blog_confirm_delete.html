{% extends 'catalog/base.html' %}

{% block content %}
<div class="card p-4 border-danger mx-auto" style="max-width: 500px;">
    <h2>Удаление статьи</h2>
    <p>Вы уверены, что хотите безвозвратно удалить статью <strong>"{{ object.title }}"</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'blog:list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
